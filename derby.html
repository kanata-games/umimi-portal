<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウミミダービー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* layout: 1枚のアプリ画面。上に週と体力、左にウミミ、右にステータスと練習ボタン。レースは夜の海を横に走る */
:root{
  --paper:#f4f3fc; --card:#ffffff; --line:#dcdcf2;
  --ink:#383566; --ink2:#6c6a98; --tide:#5b64b8; --tide2:#8a92dc;
  --moon:#e9b949; --moon2:#fbefc8; --coral:#e47b8f; --sea:#1d2255; --sea2:#2f3a86;
  --good:#4fae8a; --bad:#d9675f;
  --f-disp:"Klee One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
.toportal{font-size:13px;font-weight:700;color:var(--tide);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.toportal:hover{border-color:var(--tide2)}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:14px 28px}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-size:24px;font-weight:600;color:var(--tide);display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0}
.logo small{font-size:13px;color:var(--ink2);font-weight:400}
.top .sp{flex:1}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:500;transition:transform .1s,border-color .15s}
.btn:hover{border-color:var(--tide2)}
.btn:active{transform:translateY(1px)}
.btn.main{background:var(--tide);border-color:var(--tide);color:#fff}
.btn.main:hover{background:#4b54a6}
.btn.gold{background:var(--moon);border-color:var(--moon);color:#3b2c06}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.sub{color:var(--ink2);font-size:13.5px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center;background:linear-gradient(160deg,var(--sea),var(--sea2));color:#eef0ff;border:0}
.hero h1{color:#fff;font-size:34px;line-height:1.25}
.hero p{color:#cfd3f7;margin:8px 0 0}
.hero .menu{display:flex;flex-direction:column;gap:10px;margin-top:16px;max-width:320px}
.hero .menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff;font-weight:700}
.hero .menu .btn:hover{background:rgba(255,255,255,.24);border-color:#fff}
.hero .menu .btn.main{background:#fff;border-color:#fff;color:var(--sea)}
.hero .menu .btn.main:hover{background:#eceefe}
.hero .menu .btn.gold{background:var(--moon);border-color:var(--moon);color:#3b2c06}
.hero .menu .btn span{font-size:12.5px;font-weight:500;opacity:.9;white-space:nowrap}
#heroCv{width:100%;max-width:100%;aspect-ratio:16/10;display:block;border-radius:14px}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}.hero h1{font-size:28px}}

/* create */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--tide);background:#eceefe;color:var(--tide);font-weight:700}
.chip .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;letter-spacing:.08em;color:var(--ink2);font-weight:700}
input[type=text],textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;background:#fbfbff;color:var(--ink);width:100%;box-sizing:border-box}
.persTip{font-size:13.5px;color:var(--ink2);min-height:1.6em}

/* train */
.portrait{display:flex;flex-direction:column;gap:10px}
.portrait canvas{width:100%;aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 85%,#e4e6fb 0 35%,transparent 36%),linear-gradient(#f7f6ff,#eceafd);border-radius:14px;display:block}
.nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nm h2{font-size:22px}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;background:#eceefe;color:var(--tide);font-weight:700}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .bar{height:10px;border-radius:6px;background:#ecebf7;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:6px;background:var(--good);transition:width .35s}
.meter .t{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.mood{font-size:14px}
.weekbar{display:flex;gap:4px;align-items:flex-end}
.weekbar b{flex:1;height:8px;border-radius:3px;background:#e4e3f4}
.weekbar b.done{background:var(--tide2)}
.weekbar b.now{background:var(--tide);height:12px}
.weekbar b.race{background:var(--moon2);outline:1.5px solid var(--moon)}
.weekbar b.race.done{background:var(--moon)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.st .k{font-size:11.5px;color:var(--ink2);font-weight:700;letter-spacing:.04em}
.st .r{font-family:var(--f-disp);font-size:24px;font-weight:600;line-height:1.1}
.st .v{font-size:13px;font-variant-numeric:tabular-nums}
.st .up{color:var(--good);font-size:12px;font-weight:700;min-height:1.2em}
@media (max-width:460px){.stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.st .r{font-size:19px}.st .k{font-size:10.5px}}
.trains{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tr{border:1.5px solid var(--line);background:#fbfbff;border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tr:hover{border-color:var(--tide2);background:#f3f3ff}
.tr b{font-family:var(--f-disp);font-size:16px}
.tr .g{font-size:12.5px;color:var(--ink2)}
.tr .lv{font-size:11.5px;color:var(--tide)}
.tr .fail{font-size:12px;color:var(--bad);font-weight:700}
.tr.rest b{color:var(--good)}
.log{font-size:14px;background:#f7f6ff;border-radius:12px;padding:10px 12px;min-height:3.2em}
.log .hl{color:var(--tide);font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(29,34,85,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .panel{max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(20,20,70,.3)}
.modal h3{font-size:20px}
.modal .opts{display:flex;flex-direction:column;gap:8px}

/* race */
.racehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.racehead h2{font-size:22px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--tide);color:#fff}
#raceCv{width:100%;max-width:100%;aspect-ratio:16/10;display:block;border-radius:14px;background:var(--sea);touch-action:manipulation}
.comment{font-family:var(--f-disp);font-size:17px;min-height:1.7em;color:var(--ink)}
.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ent{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:#fbfbff;text-align:left}
.ent.me{border-color:var(--moon);background:#fffaf0}
.ent[aria-pressed="true"]{outline:3px solid var(--tide);outline-offset:-1px}
.ent .n{font-weight:700;display:flex;gap:6px;align-items:center}
.ent .n i{font-style:normal;font-size:11px;background:var(--sea);color:#fff;border-radius:5px;padding:0 6px}
.ent .s{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res li{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:4px 0}
.res li .p{font-family:var(--f-disp);font-weight:600;font-size:20px;width:2.4em;color:var(--ink2)}
.res li.first .p{color:var(--moon)}
.res li .t{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.res li.me{font-weight:700}

/* hall */
.hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.hc{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.hc .top2{display:flex;gap:10px;align-items:center}
.hc canvas{width:72px;height:54px;flex:none}
.hc .rk{font-family:var(--f-disp);font-size:26px;font-weight:600;color:var(--moon);margin-left:auto}
.hc .mini{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hc .ttl{font-size:12.5px;color:var(--tide);font-weight:700}
.hc .acts{display:flex;gap:6px;flex-wrap:wrap}
.hc.sel{border-color:var(--tide);background:#f3f3ff}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:#f7f6ff;border-radius:8px;padding:8px;user-select:all}
.empty{color:var(--ink2);text-align:center;padding:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--sea);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
/* cards */
.shard{font-size:13px;color:var(--ink2);background:var(--moon2);border-radius:999px;padding:2px 12px}
.shard b{color:#8a6410;font-variant-numeric:tabular-nums}
.shard.big{font-size:15px;padding:5px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.cards.small{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.card{--rc:#a7aec4;position:relative;border:2px solid var(--rc);border-radius:12px;background:#fff;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px;line-height:1.35;color:var(--ink)}
.card.r-SR{--rc:#e3a23f}
.card.r-SSR{--rc:#b86ad0;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#f5b0c5,#b9b6ef,#8fd3e8,#f3d68a) border-box;border-color:transparent}
.card .art{width:100%;aspect-ratio:4/3;border-radius:8px;background:radial-gradient(circle at 50% 60%,#e7ebff,#cfd6f6);position:relative;display:flex;align-items:center;justify-content:center}
.card.r-SR .art{background:radial-gradient(circle at 50% 60%,#fff6dc,#f4dca0)}
.card.r-SSR .art{background:radial-gradient(circle at 50% 60%,#fff,#e8d9f6 60%,#cfe7f6)}
.card .art canvas{width:86%;height:86%}
.card .rar{position:absolute;top:4px;left:5px;font-family:var(--f-disp);font-weight:600;font-size:13px;color:#fff;background:var(--rc);border-radius:6px;padding:0 6px}
.card.r-SSR .rar{background:linear-gradient(90deg,#e47b8f,#8a92dc)}
.card b{font-weight:700;font-size:12.5px}
.card .ty,.tyc{font-size:11px;border-radius:5px;padding:0 6px;color:#fff;font-weight:700;font-style:normal}
.t-spd{background:#5b9ee0}.t-sta{background:#e47b8f}.t-pow{background:#e3a23f}.t-gut{background:#b86ad0}.t-int{background:#4fae8a}
.card .lb{color:var(--rc);letter-spacing:1px;font-size:11px}
.card.r-SSR .lb{color:#b86ad0}
.card .badge{position:absolute;right:4px;top:4px;font-size:11px;font-weight:700;background:var(--coral);color:#fff;border-radius:6px;padding:0 6px}
button.card{cursor:pointer;font:inherit}
button.card[aria-pressed="true"]{outline:3px solid var(--tide);outline-offset:1px}
button.card[aria-pressed="true"]::after{content:"✓";position:absolute;right:6px;top:4px;background:var(--tide);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px}
.card.locked{opacity:.55}
.card.locked .q{font-family:var(--f-disp);font-size:30px;color:var(--ink2)}
.gacha{display:flex;flex-direction:column;gap:14px}
.gtop{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.gtop>div:first-child{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px}
.gbtns{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:200px}
.cards.pull .pc{animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.deck{display:flex;flex-direction:column;gap:6px}
.dk{display:flex;gap:8px;align-items:center}
.dk canvas{width:40px;height:32px;flex:none}
.dkb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.dkb .bar{height:7px;border-radius:4px;background:#ecebf7;overflow:hidden}
.dkb .bar i{display:block;height:100%;border-radius:4px}
.naka{font-size:11px;background:var(--moon);color:#3b2c06;border-radius:5px;padding:0 6px;font-weight:700;font-family:var(--f-body)}
.skl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sk{font:inherit;font-size:12px;border:1.5px solid var(--moon);background:#fffaf0;border-radius:999px;padding:1px 10px;color:#7a5a12;font-weight:700;cursor:pointer}
.sk:hover{background:var(--moon2)}
.sk::after{content:" ⓘ";font-weight:400;opacity:.7}
.tr .who{display:flex;gap:2px;margin-top:2px}
.tr .who canvas{width:34px;height:26px;border-radius:6px;background:#eceefe}
.tr .who canvas.mx{background:var(--moon2);box-shadow:0 0 0 1.5px var(--moon)}
.tr.nk{border-color:var(--moon);background:#fffaf0}
.st .up.dn{color:var(--bad)}
.evh{display:flex;gap:10px;align-items:center}
.evh canvas{width:64px;height:50px;flex:none;background:#eceefe;border-radius:10px}
.eff{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (prefers-reduced-motion:reduce){.cards.pull .pc{animation:none}}
.g{font-style:normal;font-family:var(--f-disp);font-weight:600;display:inline-block;min-width:1.2em;text-align:center;border-radius:4px;margin-left:3px;font-size:.95em;line-height:1.3}
.g-S{color:#fff;background:linear-gradient(90deg,#e47b8f,#8a92dc)}.g-A{color:#c0392b;background:#fde4dc}.g-B{color:#c7720d;background:#fdeccf}.g-C{color:#3f8f3a;background:#e2f3df}.g-D{color:#3a76b8;background:#e1ecf9}.g-E,.g-F,.g-G{color:#7c7a9a;background:#ecebf4}
.apt{display:flex;flex-direction:column;gap:4px}
.aptg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:12px}
.aptg span{background:#f7f6ff;border-radius:7px;padding:2px 2px;text-align:center;white-space:nowrap;font-size:11.5px;overflow:hidden}
.raceopts{display:flex;flex-direction:column;gap:8px}
.ro{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.ro b{font-family:var(--f-disp);font-size:17px}
.ro span{font-size:13px}
.rwrap{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:start}
@media (max-width:720px){.rwrap{grid-template-columns:minmax(0,1fr)}}
.stand{list-style:none;margin:0;padding:8px;background:var(--sea);border-radius:12px;display:flex;flex-direction:column;gap:3px;color:#e8eaff;font-size:12.5px}
@media (max-width:720px){.stand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.stand li{display:grid;grid-template-columns:1.4em minmax(0,1fr) auto;gap:2px 6px;align-items:center;padding:2px 4px;border-radius:6px}
.stand li.me{background:rgba(233,185,73,.25);color:#fbefc8}
.stand li.pk{outline:1.5px solid #6fd3a8}
.stand .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand small{font-size:10.5px;opacity:.75}
.stand .pl{grid-column:2 / 4;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;display:block}
.stand .pl i{display:block;height:100%}
.shop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.shop li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.shop li>div{min-width:0}
.shop small{color:var(--ink2);margin-left:4px}
.hint{font-size:11px;background:#e2f3df;color:#3f8f3a;border-radius:5px;padding:0 6px;font-weight:700}
.hint.inn{background:#eceefe;color:var(--tide)}
.moonmark{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--moon2);box-shadow:inset -9px -3px 0 0 var(--moon);flex:none}
.evd{line-height:1.8}
.ending{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(160deg,var(--sea),var(--sea2));color:#eef0ff;border-radius:14px;padding:14px 16px}
.ending p{margin:0;font-family:var(--f-disp);font-size:15.5px;line-height:1.85}
.ent.rival{border-color:#7f7fd0;background:#f1f0ff}
.rv{color:#5b4fb8}
.ticket{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;border:2px solid transparent;border-radius:14px;padding:12px 14px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#f5b0c5,#b9b6ef,#8fd3e8,#f3d68a) border-box}
.tk-l{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tk-l b{font-family:var(--f-disp);font-size:17px;color:#8a4fb0}
.tk-bar{display:flex;gap:5px;align-items:center}
.tk-bar i{width:26px;height:9px;border-radius:5px;background:#ecebf7}
.tk-bar i.on{background:linear-gradient(90deg,#e47b8f,#8a92dc)}
.tk-bar .sub{margin-left:6px;font-size:12.5px}
.tk-r{display:flex;gap:10px;align-items:center}
.tk-n{font-family:var(--f-disp);font-size:26px;font-weight:600;color:#8a4fb0;font-variant-numeric:tabular-nums}
.tk-got{margin:0;padding:8px 12px;border-radius:10px;background:#f6effc;color:#6b3f8f;font-weight:700}
.dresses{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.dresses.small{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dress{--rc:#a7aec4;position:relative;border:2px solid var(--rc);border-radius:12px;background:#fff;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px;line-height:1.35;color:var(--ink)}
.dress.r-SR{--rc:#e3a23f}
.dress.r-SSR{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#f5b0c5,#b9b6ef,#8fd3e8,#f3d68a) border-box;border-color:transparent}
.dress .art{width:100%;aspect-ratio:5/4;border-radius:8px;background:radial-gradient(circle at 50% 70%,#eef0ff,#d6dbf6);position:relative;display:flex;align-items:center;justify-content:center}

<script>

const APT_SPD = {S:1.005,A:1,B:.994,C:.984,D:.968,E:.95,F:.93,G:.91};
const APT_STR = {S:1.15,A:1,B:.8,C:.6,D:.4,E:.2,F:0,G:-.2};
const APT_STR_BASE = {S:1,A:1,B:.995,C:.99,D:.98,E:.97,F:.96,G:.95};
const PERS_STRAT = {genki:'AACE', nonbiri:'ECAA', kuishinbo:'CABD', amaenbo:'DBAC', nebosuke:'DCBA', koukishin:'BBBC'};
const PERS_DIST = {genki:[4,3,2,1], nonbiri:[1,2,3,3], kuishinbo:[2,3,3,1], amaenbo:[2,3,3,2], nebosuke:[1,2,3,4], koukishin:[2,3,3,2]};
function makeApt(pers){
  const w = PERS_DIST[pers]||[1,1,1,1]; let q = Math.random()*w.reduce((a,b)=>a+b,0), ai = 0; for(;ai<3;ai++){ q -= w[ai]; if(q<0) break; }
  const d = {}; DIST_KEYS.forEach((k,i)=>{ d[k] = ['A','B','D','F'][Math.abs(i-ai)]; });

}

function fixU(u){ if(!u.apt || !u.apt.d || !u.apt.s) u.apt = makeApt(u.pers); if(!STRATS[u.strat]) u.strat = bestStrat(u); if(!Array.isArray(u.skills)) u.skills = []; return u; }
const TRAINS = [
  {k:'spd', n:'およぎこみ', main:'spd', sub:{pow:5}, hp:-19},

// ---------- スキル ----------
const SKILLS = {

  stayer:{n:'遠い月へ', d:'長距離で スタミナが へりにくい', c:130, ds:'long'},
  breath:{n:'しんこきゅう', d:'3わり すぎで スタミナを 回復', c:150},

  u_star:  {n:'星めぐりの 加速', d:'終盤の はじめ、3着以内に いると 星の 力で 加速', c:0, uq:'constellation'},
  u_angel: {n:'天の はばたき', d:'のこり 2わりで スタミナが すこし 回復して 加速', c:0, uq:'angel'},
  u_gothic:{n:'月蝕の ささやき', d:'終盤に 4着より うしろだと、闇に まぎれて ぐんと 加速', c:0, uq:'gothic'},
  u_idol:  {n:'アンコール！', d:'終盤に 2着以内だと、声援を うけて 加速', c:0, uq:'idol'},
  u_space: {n:'流星ダッシュ', d:'レースの まんなかで 流れ星のように 一気に とびだす', c:0, uq:'space'},
};
const HINT_POOL = {spd:['rocket','spurt','sprint','nige1','focus'], sta:['awa','long','stayer','senko1','breath'], pow:['uzu','oikomi1','mile','rocket'], gut:['kiai','chase','sashi1','spurt'], int:['calm','focus','mid','glow','senko1']};
const INNATE = {genki:['rocket','nige1'], nonbiri:['oikomi1','breath'], kuishinbo:['senko1','uzu'], amaenbo:['chase','sashi1'], nebosuke:['spurt','oikomi1'], koukishin:['calm','mid']};
const skillCost = (k, lv) => Math.round(SKILLS[k].c * (1 - .1*Math.min(lv||0,3)));
const skillCond = k => SKILLS[k].st ? `（${STRATS[SKILLS[k].st]}）` : SKILLS[k].ds ? `（${DISTS[SKILLS[k].ds]}）` : '';
const SKILL_KEYS = Object.keys(SKILLS).filter(k=>!SKILLS[k].uq);

// ---------- 海のなかま（サポートカード） ----------
const CREA_SKILL = {dolphin:'spurt', penguin:'rocket', crab:'uzu', turtle:'awa', puffer:'kiai', octopus:'calm', star:'chase', otter:'long', seahorse:'short', jelly:'glow'};
const cardName = c => `［${c.t}］${CREA[c.v]}`;
const lbOf = id => Math.min(4, Math.max(0, (S.cards[id]||0)-1));
const DECK_MAX = 4;
// なかまの れんぞくイベント（3話）
const CHAIN = {
  dolphin:['イルカが「いっしょに 泳ごう！」と さそってくれた。','イルカが 波の のりかたを おしえてくれた。せなかに のせてもらって 大はしゃぎ！','「月光杯、ぜったい 見にいくからね」イルカと 夜の海を 全力で 泳いだ。'],
  turtle:['ウミガメが 遠い海の 話を してくれた。','ウミガメと いっしょに ゆっくり 長く 泳ぐ れんしゅう。','「あせらず、さいごまで」ウミガメの ことばを むねに しまった。'],
  crab:['カニが 大きな 岩を どかそうと している。手伝おう！','カニと 岩おし くらべ。なかなか しぶとい！','ふたりで ついに 大岩を うごかした！「すきまを ぬける コツ、わかったろ？」'],
  puffer:['フグが ぷくーっと ふくらんで ちょうせんして きた。','フグと にらめっこ。どっちも まけない！','「くるしい ときほど わらうんだ」フグの かおが ぷくっと ほころんだ。'],
  octopus:['タコが 8本の うでで 本を 読んでいる。','タコに 星の よみかたを おしえてもらった。','「レースは あたまで 走るもの」タコと さくせん会議を した。'],
  penguin:['ペンギンが 氷の 上を すいーっと すべってきた。','ペンギンと スタートの れんしゅう。ぴょんと とびこむ！','「いちばんに とびだしたもん勝ち！」ふたりで ならんで とびこんだ。'],

  jelly:['クラゲが ふわふわ 光っている。','クラゲと いっしょに 夜の 水面を ただよった。','「月の 光は、いつも きみの 味方」クラゲの 光が ウミミを つつんだ。'],
};

// ---------- 保存 ----------
let S;
function load(){
  let d=null; try{ d = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
  if(!d || typeof d!=='object') d = {};
  const B = UMI.loadBook(); UMI.BOOK_KEYS.forEach(k=>{ d[k] = B[k]; });
  if(!Array.isArray(d.hall)) d.hall = [];
  if(!d.cur) d.cur = null;
  if(!d.speed) d.speed = 1;
  if(!d.nextId) d.nextId = 1;
  if(typeof d.shards!=='number') d.shards = 600;
  if(typeof d.tenCount!=='number') d.tenCount = 0;
  if(typeof d.ssrTickets!=='number') d.ssrTickets = 0;
  if(!d.dresses || typeof d.dresses!=='object') d.dresses = {};
  if(typeof d.dressTickets!=='number') d.dressTickets = 3;
  if(!d.cards || typeof d.cards!=='object') d.cards = {};
  if(!Array.isArray(d.lastDeck)) d.lastDeck = [];
  if(d.cur){ const C=d.cur; if(!Array.isArray(C.deck)) C.deck=[]; if(!C.bond) C.bond={}; if(!C.chain) C.chain={}; if(!C.wk) C.wk=null; if(typeof C.sp!=='number') C.sp=0; if(!C.hints) C.hints={}; fixU(C.u); }
  d.hall.forEach(e=>fixU(e));
  return d;
}
// かけら・カード・勝負服・でんどうは ウミミ帳（全ゲーム共通）に、のこりは ダービー用の セーブに 書く
function save(){

}
S = load();

// ---------- 連携コード ----------
const CODE_PREFIX = 'UMDB1-';
function toCode(u){
  const o = {n:u.name, c:u.color, p:u.pers, s:STATS.map(s=>u.st[s.k]), r:u.rank||'', t:u.title||'', k:(u.skills||[]).slice(0,20), a:DIST_KEYS.map(k=>u.apt.d[k]).join('')+STRAT_KEYS.map(k=>u.apt.s[k]).join(''), g:u.strat, o:u.outfit||''};
  return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function fromCode(str){
  str = String(str||'').trim(); if(!str.startsWith(CODE_PREFIX)) return null;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(str.slice(CODE_PREFIX.length)))));
    if(!o || !Array.isArray(o.s) || o.s.length!==5) return null;
    const st = {}; STATS.forEach((s,i)=>{ st[s.k] = clamp(Math.round(+o.s[i]||0), 1, STAT_MAX); });
    const skills = Array.isArray(o.k) ? [...new Set(o.k.filter(k=>SKILLS[k]))] : [];
    const u = {name:String(o.n||'ゲスト').slice(0,10), color:PALS[o.c]?o.c:'lavender', pers:PERS[o.p]?o.p:'genki', st, skills, rank:totalRank(sumSt(st)+skills.length*15), title:String(o.t||'').slice(0,20)};
    const a = String(o.a||''); if(/^[SABCDEFG]{8}$/.test(a)){ u.apt = {d:{}, s:{}}; DIST_KEYS.forEach((k,i)=>u.apt.d[k]=a[i]); STRAT_KEYS.forEach((k,i)=>u.apt.s[k]=a[4+i]); }
    u.strat = STRATS[o.g] ? o.g : undefined;
    if(DRESSES[o.o]) u.outfit = o.o;
    return fixU(u);
  }catch(e){ return null; }
}

// ---------- スプライト ----------
function cardTile(id, opt){
  opt = opt || {}; const c = CARD[id], own = S.cards[id]||0;
  if(opt.hide && !own) return `<div class="card r-${c.r} locked"><div class="art"><span class="q">？</span></div><span class="rar">${c.r}</span><b>？？？</b><span class="ty">${stName(c.type)}</span></div>`;
  const lb = lbOf(id);

// 毎週、なかまが どの練習に 来るかを きめる
function assignCards(C){
  const wk = {};
  (C.deck||[]).forEach(id=>{ if(Math.random()<.18) return; const c=CARD[id];
    const ti = Math.random()<.45 ? TRAINS.findIndex(t=>t.main===c.type) : ri(0,TRAINS.length-1); wk[id]=ti; });
  C.wk = {week:C.week, at:wk};
}
function presentAt(C, ti){ if(!C.wk || C.wk.week!==C.week) assignCards(C); return Object.keys(C.wk.at).filter(id=>C.wk.at[id]===ti); }
const BOND_MAX = 100, NAKA = 75;
function isNaka(C, id, tr){ return (C.bond[id]||0) >= NAKA && CARD[id].type===tr.main; }
function gainOf(C, tr, ti){
  const P = PERS[C.u.pers], mf = MOODS[C.mood].f, lv = C.lv[tr.k]||0, lvf = 1 + Math.min(lv,8)*.06;
  const here = ti!=null ? presentAt(C, ti) : [];
  let cardMul = 1 + here.length*.05, flat = 0, naka = 1;
  here.forEach(id=>{ const c=CARD[id], R=RAR[c.r], lb=lbOf(id);
    if(c.type===tr.main){ cardMul += R.bonus + lb*.02; flat += R.flat + (lb>=4?1:0); }
    else cardMul += (R.bonus + lb*.02)*.4;
    if(isNaka(C,id,tr)) naka *= R.naka + lb*.02; });
  const out = {}; const m = 17*mf*lvf*(P.bonus===tr.main?1.12:1)*cardMul*naka + flat;
  out[tr.main] = Math.round(m);
  for(const [k,v] of Object.entries(tr.sub)) out[k] = Math.round(v*mf*lvf*cardMul*(naka>1?1.2:1));
  return out;
}
const failRate = hp => hp>=45 ? 0 : Math.round(clamp((45-hp)*1.8, 0, 80));
function addSt(u, g){ for(const [k,v] of Object.entries(g)) u.st[k] = clamp(u.st[k]+v, 1, STAT_MAX); }
function moodAdd(C, d){ C.mood = clamp(C.mood + d, 0, 4); }
function bondCol(v){ return v>=NAKA ? 'var(--moon)' : v>=50 ? 'var(--good)' : 'var(--tide2)'; }

        <button type="button" class="tr rest" id="tRest"><b>おひるね</b><span class="g">たいりょく +${C.u.pers==='nebosuke'?55:45}</span><span class="lv">すやすや 休む</span></button>

function doTrain(ti){

  if(has('nige1') && r.strat==='nige' && prog<.3){ vt *= 1.04; if(prog>.05) fire('nige1'); }
  if(has('senko1') && r.strat==='senko' && prog>.3 && prog<.7){ drainMul *= .94; fire('senko1'); }
  if(has('sashi1') && r.strat==='sashi' && prog>.65){ vt *= 1.05; fire('sashi1'); }

function raceTick(dt, silent){

    R.acc -= step; R.t += step;
    R.rs.forEach(r=>{ const was=r.fin; stepRunner(r, R.rs, step, R.dist, R.rnd); if(was==null && r.x>=R.dist){ r.fin=R.t; R.order.push(r); if(R.order.length===1 && !silent) say(`${r.u.name}が 1着で ゴール！`); } });

        const L = live[0], li = R.rs.indexOf(L), prog = L.x/R.dist;

        if(prog>.5 && !R.flags.half){ R.flags.half=1; say(`はんぶん 通過。せんとうは ${L.u.name}！`); }

// ---------- なかまガチャ ----------
const PULL_COST = 30;
function rollCard(minR){
  let r; const q = Math.random()*100;
  r = q < RAR.SSR.rate ? 'SSR' : q < RAR.SSR.rate + RAR.SR.rate ? 'SR' : 'R';
  if(minR==='SR' && r==='R') r = Math.random()*100 < RAR.SSR.rate/(RAR.SSR.rate+RAR.SR.rate)*100 ? 'SSR' : 'SR';
  return pick(CARDS.filter(c=>c.r===r)).id;
}
const TICKET_EVERY = 5;
function addCard(id){
  const had = S.cards[id]||0;
  if(!had){ S.cards[id]=1; return 'NEW'; }
  if(had<5){ S.cards[id]=had+1; return 'とっぱ！'; }
  S.shards += 10; return 'かけら+10';
}
function doPull(n){
  const cost = n*PULL_COST; if(S.shards < cost) return toast('つきのかけらが たりないよ');
  S.shards -= cost; const out = [];
  for(let i=0;i<n;i++){ const id = rollCard(n===10 && i===9 && !out.some(o=>CARD[o.id].r!=='R') ? 'SR' : null);
    out.push({id, tag:addCard(id)}); }
  let gotTicket = false;
  if(n===10){ S.tenCount++; if(S.tenCount % TICKET_EVERY === 0){ S.ssrTickets++; gotTicket = true; } }
  save(); showGacha(out, gotTicket);
}
function useTicket(){
  if(S.ssrTickets<1) return;
  S.ssrTickets--; const id = pick(CARDS.filter(c=>c.r==='SSR')).id;
  const tag = addCard(id); save(); showGacha([{id, tag}], false, true);
}

    <div class="gtop"><div><p class="sub">月の海の なかまが サポートに 来てくれるよ。同じ なかまが 重なると「とっぱ」して 強くなる（最大4回）。</p>

      <div class="gbtns"><span class="shard big">つきのかけら <b>${S.shards}</b></span>
        <button class="btn" id="g1" type="button" ${S.shards<PULL_COST?'disabled':''}>1回 ひく（${PULL_COST}）</button>

        <div class="tk-bar" aria-label="つぎの チケットまで">${Array.from({length:TICKET_EVERY},(_,i)=>`<i class="${i < S.tenCount % TICKET_EVERY ? 'on':''}"></i>`).join('')}<span class="sub">あと ${TICKET_EVERY - S.tenCount % TICKET_EVERY}回</span></div></div>
      <div class="tk-r"><span class="tk-n">×${S.ssrTickets}</span><button class="btn ${S.ssrTickets?'main':''}" id="gTk" type="button" ${S.ssrTickets?'':'disabled'}>チケットを つかう</button></div>

    showVsSetup(); $('vMsg').textContent = ok||bad ? `${ok}匹 ついか${bad?`／よめなかった ${bad}こ`:''}` : 'コードが はいっていないよ';
  });
  document.querySelectorAll('#vList [data-key]').forEach(el=>{ const tog=()=>{ const k=el.dataset.key; if(vsSel.has(k)) vsSel.delete(k); else if(vsSel.size<RUNNERS) vsSel.add(k); else return toast(`${RUNNERS}匹までだよ`); showVsSetup(); };
    el.addEventListener('click', tog); el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tog(); } }); });
  $('vGo').addEventListener('click', ()=>{
    const picked = all.filter(e=>vsSel.has(e.key)).map(e=>fixU({name:e.name, color:e.color, pers:e.pers, outfit:e.outfit||'', st:Object.assign({},e.st), skills:(e.skills||[]).slice(), apt:JSON.parse(JSON.stringify(e.apt)), strat:e.strat}));
    const used = new Set(picked.map(p=>p.name)); const avg = picked.length ? picked.reduce((a,p)=>a+sumSt(p.st),0)/picked.length : 600;
    while(picked.length<RUNNERS) picked.push(rivalOf([avg*.85, avg*1.05], used, ri(0,2), vsDist));
    picked.sort(()=>Math.random()-.5);
    setupRace({title:`みんなで レース ${vsDist}m`, dist:vsDist, us:picked, mode:'vs'});
  });
  if($('vList')) requestAnimationFrame(()=>drawMinis($('vList')));
}

// ---------- ループ（30fpsで軽く） ----------
let last = performance.now(), lastDraw = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(now - lastDraw < 32) return;
  const dt = Math.min(.1, (now-last)/1000); last = now; lastDraw = now;
  if(anim && !document.hidden){ try{ anim.draw(now/1000, dt); }catch(e){ console.error(e); } }
}
requestAnimationFrame(loop);
$('modal').addEventListener('click', e=>{ if(e.target===$('modal') && $('mClose')) $('mClose').click(); });
window.__derbyTest = {simulate, rivalOf, STATS};
showHome();
})();
</script>
